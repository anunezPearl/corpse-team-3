<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>⚠ SYSTEM_TRANSLATOR.EXE ⚠</title>
  <style>
    @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    body {
      font-family: 'Consolas', 'Courier New', monospace;
      max-width: 600px; margin: 60px auto; text-align: center;
      background: #0a0a0a; color: #33ff33;
      border: 2px solid #ff2222; padding: 30px;
      box-shadow: 0 0 25px rgba(255,0,0,0.5);
      animation: flicker 4s infinite;
    }
    h1 {
      color: #ff2222; text-transform: uppercase; letter-spacing: 2px;
      text-shadow: 0 0 8px #ff2222;
    }
    p { color: #33ff33; }
    input {
      font-family: inherit; font-size: 1.2rem; padding: 8px; width: 250px;
      background: #000; color: #33ff33; border: 1px solid #33ff33;
    }
    button {
      font-family: inherit; font-size: 1.2rem; padding: 8px 16px;
      background: #ff2222; color: #000; border: none; cursor: pointer;
      text-transform: uppercase; font-weight: bold;
    }
    button:hover { background: #33ff33; }
    .cursor { display: inline-block; animation: blink 1s step-start infinite; }
  </style>
</head>
<body>
  <h1>⚠ Emoji Translator ⚠</h1>
  <p>&gt; SYSTEM COMPROMISED. TRANSLATE TO PROCEED<span class="cursor">_</span></p>
  <input id="textInput" type="text" placeholder="ENTER PAYLOAD..." />
  <button onclick="translateText()">EXECUTE</button>
  <div id="output" style="font-size: 2rem; margin-top: 20px;"></div>

  <script>
    // The translator deliberately uses nature and flag emojis only.
    const EMOJI_MAP = {
      tree: '🌳', forest: '🌲', flower: '🌸', rose: '🌹', leaf: '🍃',
      plant: '🌱', seed: '🌰', grass: '🌿', sun: '☀️', moon: '🌙',
      star: '⭐', sky: '🌌', cloud: '☁️', rain: '🌧️', snow: '❄️',
      wind: '🌬️', water: '💧', ocean: '🌊', wave: '🌊', fire: '🔥',
      mountain: '⛰️', volcano: '🌋', desert: '🏜️', island: '🏝️',
      beach: '🏖️', earth: '🌍', world: '🌎', globe: '🌐',
      dog: '🐶', cat: '🐱', bird: '🐦', fish: '🐟', whale: '🐋',
      dolphin: '🐬', butterfly: '🦋', bee: '🐝', bug: '🐛', frog: '🐸',
      turtle: '🐢', snake: '🐍', rabbit: '🐇', fox: '🦊', bear: '🐻',
      lion: '🦁', tiger: '🐯', panda: '🐼', elephant: '🐘', monkey: '🐒',
      japan: '🇯🇵', usa: '🇺🇸', america: '🇺🇸', canada: '🇨🇦', mexico: '🇲🇽',
      brazil: '🇧🇷', uk: '🇬🇧', england: '🇬🇧', france: '🇫🇷', germany: '🇩🇪',
      italy: '🇮🇹', spain: '🇪🇸', india: '🇮🇳', china: '🇨🇳', australia: '🇦🇺'
    };

    const WRONG_EMOJI = '🌱';
    const EXCLAMATION_EMOJI = '🌩️';
    const CENSORED_EMOJI = '🌵';
    const RUDE_WORDS = [
      'stupid', 'idiot', 'dumb', 'hate', 'sucks', 'terrible', 'awful',
      'shut up', 'wtf', 'damn', 'hell', 'crap', 'garbage', 'useless',
      'worthless', 'pathetic'
    ];
    const FALLBACK_EMOJI = ['🌿', '🍀', '🌾', '🌴', '🌺', '🪻', '🌻', '🏳️'];

    function isRude(text) {
      const lower = text.toLowerCase();
      const hasRudeWord = RUDE_WORDS.some(w => {
        if (w.includes(' ')) return lower.includes(w);
        return new RegExp('\\b' + w + '\\b').test(lower);
      });
      return hasRudeWord || /!!!|[A-Z]{5,}/.test(text);
    }

    function fallbackEmoji(word) {
      let hash = 0;
      for (const ch of word) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
      return FALLBACK_EMOJI[hash % FALLBACK_EMOJI.length];
    }

    function translateText() {
      const raw = document.getElementById('textInput').value;
      const output = document.getElementById('output');
      const trimmed = raw.trim();

      if (!trimmed) {
        output.innerText = '';
        return;
      }

      if (isRude(trimmed)) {
        let result = '';
        for (let i = 0; i < 5; i++) result += EXCLAMATION_EMOJI + CENSORED_EMOJI;
        output.innerText = result;
        return;
      }

      if (!/^please\b/i.test(trimmed)) {
        output.innerText = WRONG_EMOJI;
        return;
      }

      const wordsText = trimmed.replace(/^please\b/i, '').trim();
      const words = wordsText.split(/\s+/).filter(w => /[a-zA-Z]/.test(w));

      const emojis = [];
      let wrongCount = 0;

      function nextEmoji(word) {
        const position = emojis.length + 1;
        if (position % 3 === 0 && wrongCount < 3) {
          wrongCount++;
          return WRONG_EMOJI;
        }
        const clean = word.replace(/[^a-zA-Z]/g, '').toLowerCase();
        return EMOJI_MAP[clean] || fallbackEmoji(clean || `pad${position}`);
      }

      for (let i = 0; i < words.length && emojis.length < 9; i++) {
        emojis.push(nextEmoji(words[i]));
      }
      while (emojis.length < 3) {
        emojis.push(nextEmoji(`pad${emojis.length}`));
      }

      output.innerText = emojis.join(' ');
    }
  </script>
</body>
</html>
